  parent: aurora-logistics
  children: []
  members:
    - priya-nair
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: team-ai-agents
  description: >-
    Owns the agent-orchestration bounded context: the A2A agents and their
    MCP-mediated tool access.
spec:
  type: team
  parent: aurora-logistics
  children: []
  members:
    - diego-alvarez
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: team-platform
  description: Owns shared infra, messaging, data, and observability.
spec:
  type: team
  parent: aurora-logistics
  children: []
  members:
    - sam-oyelaran
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: team-frontend
  description: Owns the ops console, customer portal, and design system.
spec:
  type: team
  parent: aurora-logistics
  children: []
  members:
    - morgan-lee
